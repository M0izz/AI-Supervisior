services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-supervisor
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    environment:
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  falkordb_data:
