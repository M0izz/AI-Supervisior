services:
  - type: web
    name: ai-supervisor-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEBIUS_BASE_URL
        value: https://api.studio.nebius.ai/v1
      - key: NEBIUS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
